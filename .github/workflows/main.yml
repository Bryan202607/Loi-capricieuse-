name: Construire le jeu (web, APK, AAB)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "projet.zip"
      - "**/*.gd"
      - "assets/**"
      - "export_presets.cfg"
      - "project.godot"
      - "main.tscn"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Importer le projet envoye (projet.zip)
        run: |
          if [ -f projet.zip ]; then
            unzip -o -q projet.zip
            rm projet.zip
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add -A -- . ':!.github'
            git commit -m "Import du projet" || true
            git push || true
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Godot et les modeles d export
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -q -j Godot_v4.3-stable_export_templates.tpz "templates/*" -d ~/.local/share/godot/export_templates/4.3.stable
          rm -f Godot_v4.3-stable_export_templates.tpz Godot_v4.3-stable_linux.x86_64.zip

      - name: Installer Android SDK
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          SDKM=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmake;3.10.2.4988404" "ndk;23.2.8568313" > /dev/null
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Cle de signature Android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            PASS="$KS_PASS"
          else
            echo "::warning::Pas de cle secrete trouvee : cle temporaire utilisee. L'AAB ne sera pas accepte par le Play Store."
            PASS="temporary-pass"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.keystore" -alias lois -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Temporaire"
          fi
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=lois" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Importer les ressources
        run: godot --headless --path . --import || true

      - name: Exporter la version web
        run: |
          mkdir -p web
          godot --headless --path . --export-release "Web" web/index.html
          test -f web/index.html

      - name: Preparer Android
        run: |
          mkdir -p android/build build/android
          unzip -q -o ~/.local/share/godot/export_templates/4.3.stable/android_source.zip -d android/build
          echo "4.3.stable" > android/.build_version
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg

      - name: Diagnostic Android
        run: |
          echo "SDK=$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT" || true
          ls "$ANDROID_SDK_ROOT/cmdline-tools" "$ANDROID_SDK_ROOT/build-tools" "$ANDROID_SDK_ROOT/platform-tools" | head -30 || true
          cat ~/.config/godot/editor_settings-4.3.tres || true
          ls -la android android/build | head -20 || true
          cat android/.build_version || true
          echo "KS=$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"
          ls -la "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH" || true
          echo "JAVA=$JAVA_HOME"

      - name: Exporter l'APK
        run: |
          godot --headless --path . --export-release "Android APK" build/android/lois-capricieuses.apk 2>&1 | cat -A | tail -40
          test -f build/android/lois-capricieuses.apk

      - name: Exporter l'AAB
        run: |
          godot --headless --path . --export-release "Android AAB" build/android/lois-capricieuses.aab
          test -f build/android/lois-capricieuses.aab

      - name: Garder les fichiers
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/android/*

      - name: Publier dans " Releases "
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Version ${{ github.run_number }}
          files: |
            build/android/lois-capricieuses.apk
            build/android/lois-capricieuses.aab

      - name: Mettre a jour la version web dans le depot
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add web
          git diff --cached --quiet || (git commit -m "Mise a jour de la version web" && git push)
